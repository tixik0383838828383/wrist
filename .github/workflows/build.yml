name: Build WristWatch

on:
  workflow_dispatch:
  push:
    paths:
      - 'wristwatch/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle build --no-daemon --stacktrace
        working-directory: wristwatch

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: wristwatch-jar
          path: wristwatch/build/libs/*.jar
